# ========== 公用后处理锚点 ==========
gib_convert: &gib_convert
  - type: calculate
    operation: divide
    by: 1073741824
  - type: add_unit
    unit: "GiB"

mib_convert: &mib_convert
  - type: calculate
    operation: divide
    by: 1048576
  - type: add_unit
    unit: "MiB"

kib_convert: &kib_convert
  - type: calculate
    operation: divide
    by: 1024
  - type: add_unit
    unit: "KiB"

extract_number: &extract_number
  - type: extract_number

partition_style_map: &partition_style_map
  - type: map
    mapping:
      "0": "Unknown"
      "1": "MBR"
      "2": "GPT"
      "3": "RAW"

media_type_map: &media_type_map
  - type: map
    mapping:
      "0": "Unknown"
      "3": "HDD"
      "4": "SSD"
      "5": "USB"

bus_type_map: &bus_type_map
  - type: map
    mapping:
      "0": "Unknown"
      "1": "SCSI"
      "2": "ATAPI"
      "3": "ATA"
      "4": "IEEE 1394"
      "5": "SSA"
      "6": "Fibre Channel"
      "7": "USB"
      "8": "RAID"
      "9": "iSCSI"
      "10": "SAS"
      "11": "SATA"
      "12": "SD"
      "13": "MMC"
      "14": "Virtual"
