# ========== 项列表 ==========
items:

  # ---------- Computer ----------
  - id: "0101"
    category: Computer
    standard_name: Device Name
    chinese_name: 主机名
    multiplicity: 0
    CIM:
      ClassName: Win32_ComputerSystem
      Property: Name
    REG:
      key: "HKLM:\\SYSTEM\\CurrentControlSet\\Control\\ComputerName\\ComputerName"
      value: "ComputerName"
    psutil:
      impl: hostname
    SystemInfo:
      field: "主机名"

  - id: "0102"
    category: Computer
    standard_name: System Manufacturer
    chinese_name: 制造商
    multiplicity: 0
    CIM:
      ClassName: Win32_ComputerSystem
      Property: Manufacturer
    REG:
      key: "HKLM:\\HARDWARE\\DESCRIPTION\\System\\BIOS"
      value: "SystemManufacturer"
    SystemInfo:
      field: "系统制造商"

  - id: "0103"
    category: Computer
    standard_name: System Model
    chinese_name: 型号
    multiplicity: 0
    CIM:
      ClassName: Win32_ComputerSystem
      Property: Model
    REG:
      key: "HKLM:\\HARDWARE\\DESCRIPTION\\System\\BIOS"
      value: "SystemProductName"
    SystemInfo:
      field: "系统型号"

  - id: "0104"
    category: Computer
    standard_name: System Type
    chinese_name: 架构
    multiplicity: 0
    CIM:
      ClassName: Win32_ComputerSystem
      Property: SystemType
    SystemInfo:
      field: "系统类型"

  # ---------- System ----------
  - id: "0201"
    category: System
    standard_name: OS Name
    chinese_name: 名称
    multiplicity: 0
    CIM:
      ClassName: Win32_OperatingSystem
      Property: Caption
      post_process: *system_name_map
    REG:
      key: "HKLM:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion"
      value: "ProductName"
    SystemInfo:
      field: "OS 名称"
      post_process: *system_name_map

  - id: "0202"
    category: System
    standard_name: Version
    chinese_name: 版本
    multiplicity: 0
    REG:
      key: "HKLM:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion"
      value: "DisplayVersion"

  - id: "0203"
    category: System
    standard_name: Build
    chinese_name: 内部版本
    multiplicity: 0
    CIM:
      ClassName: Win32_OperatingSystem
      Property: BuildNumber
    REG:
      key: "HKLM:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion"
      value: "CurrentBuild"

  - id: "0204"
    category: System
    standard_name: Activation Status
    chinese_name: 激活状态
    multiplicity: 0
    Powershell:
    - command: |
        Get-CimInstance -ClassName SoftwareLicensingProduct `
          -Filter "ApplicationID = '55c92734-d682-4d71-983e-d6ec3f16059f' and PartialProductKey is not null" |
        Select-Object -ExpandProperty LicenseStatus
      post_process:
      - type: map
        mapping:
          "0": "未激活"
          "1": "已激活"

  - id: "0205"
    category: System
    standard_name: Display Language
    chinese_name: 语言
    multiplicity: 0
    CIM:
      ClassName: Win32_OperatingSystem
      Property: MUILanguages
      post_process:
      - type: extract
        index: 0
    REG:
      key: "HKCU:\\Control Panel\\Desktop"
      value: "PreferredUILanguages"
      post_process:
      - type: extract
        index: 0

  - id: "0206"
    category: System
    standard_name: Region
    chinese_name: 国家或地区
    multiplicity: 0
    REG:
      key: "HKCU:\\Control Panel\\International\\Geo"
      value: "Name"
    Powershell:
    - command: "(Get-WinHomeLocation).HomeLocation"

  - id: "0207"
    category: System
    standard_name: Time Zone
    chinese_name: 时区
    multiplicity: 0
    CIM:
      ClassName: Win32_TimeZone
      Property: Caption

  - id: "0208"
    category: System
    standard_name: User Name
    chinese_name: 当前用户
    multiplicity: 0
    CIM:
      ClassName: Win32_ComputerSystem
      Property: UserName

  - id: "0209"
    category: System
    standard_name: Administrator_Disabled
    chinese_name: 本地超级管理员
    multiplicity: 0
    Powershell:
      - command: |
          Get-CimInstance -ClassName Win32_UserAccount -Filter "Name='Administrator'" |
          Select-Object -ExpandProperty Disabled
        post_process:
          - type: map
            mapping:
              "True": "禁用"
              "False": "激活"

  - id: "0210"
    category: System
    standard_name: ElementName
    chinese_name: 电源计划
    multiplicity: 0
    Powershell:
    - command: "powercfg /getactivescheme | ForEach-Object { $_.split('(')[1].split(')')[0] }"

  - id: "0211"
    category: System
    standard_name: InstallDate
    chinese_name: 系统安装日期
    multiplicity: 0
    hide: true
    CIM:
      ClassName: Win32_OperatingSystem
      Property: InstallDate
      post_process:
      - type: extract_number
      - type: map
        mapping: {}

  - id: "0212"
    category: System
    standard_name: LastBootUpTime
    chinese_name: 上次启动时间
    multiplicity: 0
    hide: true
    CIM:
      ClassName: Win32_OperatingSystem
      Property: LastBootUpTime
      post_process:
      - type: extract_number
      - type: map
        mapping: {}

  - id: "0213"
    category: System
    standard_name: SystemDirectory
    chinese_name: 系统目录
    multiplicity: 0
    hide: true
    CIM:
      ClassName: Win32_OperatingSystem
      Property: SystemDirectory

  - id: "0214"
    category: System
    standard_name: Total Processes
    chinese_name: 进程
    multiplicity: 0
    hide: true
    Powershell:
    - command: "(Get-Process).Count"

  - id: "0215"
    category: System
    standard_name: Total Threads
    chinese_name: 线程
    multiplicity: 0
    hide: true
    Powershell:
    - command: "(Get-Process | ForEach-Object { $_.Threads.Count } | Measure-Object -Sum).Sum"

  - id: "0216"
    category: System
    standard_name: Total Handles
    chinese_name: 句柄
    multiplicity: 0
    hide: true
    Powershell:
    - command: "(Get-Process | ForEach-Object { $_.HandleCount } | Measure-Object -Sum).Sum"

  # ---------- Mainboard ----------
  - id: "0301"
    category: Mainboard
    standard_name: BaseBoard Product
    chinese_name: 型号
    multiplicity: 0
    CIM:
      ClassName: Win32_BaseBoard
      Property: Product
    REG:
      key: "HKLM:\\HARDWARE\\DESCRIPTION\\System\\BIOS"
      value: "BaseBoardProduct"

      
  - id: "0302"
    category: Mainboard
    standard_name: BaseBoard Manufacturer
    chinese_name: 主板厂商
    multiplicity: 0
    CIM:
      ClassName: Win32_BaseBoard
      Property: Manufacturer
    REG:
      key: "HKLM:\\HARDWARE\\DESCRIPTION\\System\\BIOS"
      value: "BaseBoardManufacturer"


  - id: "0303"
    category: Mainboard
    standard_name: BIOS Mode
    chinese_name: BIOS模式
    multiplicity: 0
    Powershell:
    - command: "Confirm-SecureBootUEFI"
      post_process:
      - type: map
        mapping:
          "True": "UEFI"
          "False": "UEFI"
    - command: "Get-Disk | Where-Object {$_.IsBoot} | Select-Object -First 1 -ExpandProperty PartitionStyle"
      post_process:
      - type: map
        mapping:
          "GPT": "UEFI"
          "MBR": "Legacy"
          "RAW": "Unknown"
    - command: "(Get-WmiObject Win32_ComputerSystem).BootupState"
      post_process:
      - type: map
        mapping:
          "Normal boot": "UEFI"
          "Fail-safe boot": "Legacy"

  - id: "0304"
    category: Mainboard
    standard_name: BaseBoard Serial Number
    chinese_name: 主板序列号
    multiplicity: 0
    hide: true
    CIM:
      ClassName: Win32_BaseBoard
      Property: SerialNumber

  - id: "0305"
    category: Mainboard
    standard_name: BaseBoard Version
    chinese_name: 主板版本
    multiplicity: 0
    hide: true
    CIM:
      ClassName: Win32_BaseBoard
      Property: Version

  - id: "0306"
    category: Mainboard
    standard_name: BIOS Version
    chinese_name: BIOS版本
    multiplicity: 0
    CIM:
      ClassName: Win32_BIOS
      Property: SMBIOSBIOSVersion
    REG:
      key: "HKLM:\\HARDWARE\\DESCRIPTION\\System\\BIOS"
      value: "BIOSVersion"

  - id: "0307"
    category: Mainboard
    standard_name: BIOS Manufacturer
    chinese_name: BIOS厂商
    multiplicity: 0
    CIM:
      ClassName: Win32_BIOS
      Property: Manufacturer
    REG:
      key: "HKLM:\\HARDWARE\\DESCRIPTION\\System\\BIOS"
      value: "SystemManufacturer"



  # ---------- CPU ----------
  - id: "0401"
    category: CPU
    standard_name: Processor
    chinese_name: 型号
    multiplicity: 0
    CIM:
      ClassName: Win32_Processor
      Property: Name
    REG:
      key: "HKLM:\\HARDWARE\\DESCRIPTION\\System\\CentralProcessor\\0"
      value: "ProcessorNameString"

  - id: "0402"
    category: CPU
    standard_name: Base Speed
    chinese_name: 基准速度
    multiplicity: 0
    CIM:
      ClassName: Win32_Processor
      Property: MaxClockSpeed
      post_process:
      - type: calculate
        operation: divide
        by: 1000
      - type: add_unit
        unit: "GHz"
    REG:
      key: "HKLM:\\HARDWARE\\DESCRIPTION\\System\\CentralProcessor\\0"
      value: "~MHz"
      post_process:
      - type: calculate
        operation: divide
        by: 1000
      - type: add_unit
        unit: "GHz"

  - id: "0403"
    category: CPU
    standard_name: Cores
    chinese_name: 物理核心
    multiplicity: 0
    CIM:
      ClassName: Win32_Processor
      Property: NumberOfCores
    psutil:
      impl: cpu_count.physical

  - id: "0404"
    category: CPU
    standard_name: Logical Processors
    chinese_name: 逻辑核心
    multiplicity: 0
    CIM:
      ClassName: Win32_ComputerSystem
      Property: NumberOfLogicalProcessors
    psutil:
      impl: cpu_count.logical

  - id: "0405"
    category: CPU
    standard_name: L1 Cache
    chinese_name: 一级缓存
    multiplicity: 1
    cpucache:
      level: L1
      post_process:
      - type: sum
      - type: add_unit
        unit: "KiB"

  - id: "0406"
    category: CPU
    standard_name: L2 Cache
    chinese_name: 二级缓存
    multiplicity: 1
    cpucache:
      level: L2
      post_process:
      - type: sum
      - type: add_unit
        unit: "KiB"

  - id: "0407"
    category: CPU
    standard_name: L3 Cache
    chinese_name: 三级缓存
    multiplicity: 1
    cpucache:
      level: L3
      post_process:
      - type: sum
      - type: add_unit
        unit: "KiB"

  # ---------- Memory ----------
  - id: "0501"
    category: Memory
    standard_name: MemoryDevices
    chinese_name: 插槽总数
    multiplicity: 0
    CIM:
      ClassName: Win32_PhysicalMemoryArray
      Property: MemoryDevices

  - id: "0502"
    category: Memory
    standard_name: MemoryDevices
    chinese_name: 已使用插槽
    multiplicity: 0
    Powershell:
    - command: "(Get-CimInstance -ClassName Win32_PhysicalMemory).Count"

  - id: "0503"
    category: Memory
    standard_name: ErrorCorrection
    chinese_name: ECC
    multiplicity: 0
    CIM:
      ClassName: Win32_PhysicalMemoryArray
      Property: MemoryErrorCorrection
      post_process: *ecc_map
    Powershell:
    - command: |
        (Get-CimInstance Win32_PhysicalMemoryArray).MemoryErrorCorrection
      post_process: *ecc_map

  - id: "0504"
    category: Memory
    standard_name: Capacity
    chinese_name: 容量
    multiplicity: 1
    CIM:
      ClassName: Win32_PhysicalMemory
      Property: Capacity
      post_process: 
      - type: human_readable_size
        unit: "Byte"

  - id: "0505"
    category: Memory
    standard_name: Speed
    chinese_name: 速度
    multiplicity: 1
    CIM:
      ClassName: Win32_PhysicalMemory
      Property: ConfiguredClockSpeed
      post_process:
      - type: add_unit
        unit: "MHz"

  - id: "0506"
    category: Memory
    standard_name: MemoryType
    chinese_name: 代际
    multiplicity: 1
    CIM:
      ClassName: Win32_PhysicalMemory
      Property: SMBIOSMemoryType
      post_process:
      - type: map
        mapping:
          "0": "Unknown"
          "1": "Other"
          "2": "DRAM"
          "3": "Synchronous DRAM"
          "4": "Cache DRAM"
          "5": "EDO"
          "6": "EDRAM"
          "7": "VRAM"
          "8": "SRAM"
          "9": "RAM"
          "10": "ROM"
          "11": "Flash"
          "12": "EEPROM"
          "13": "FEPROM"
          "14": "EPROM"
          "15": "CDRAM"
          "16": "3DRAM"
          "17": "SDRAM"
          "18": "SGRAM"
          "19": "RDRAM"
          "20": "DDR"
          "21": "DDR2"
          "22": "DDR2 FB-DIMM"
          "23": "Reserved"
          "24": "DDR3"
          "25": "FBD2"
          "26": "DDR4"
          "27": "LPDDR"
          "28": "LPDDR2"
          "29": "LPDDR3"
          "30": "LPDDR4"
          "31": "Logical non-volatile device"
          "32": "HBM"
          "33": "HBM2"
          "34": "DDR5"
          "35": "LPDDR5"
          "36": "HBM3"

  - id: "0507"
    category: Memory
    standard_name: PartNumber
    chinese_name: 型号
    multiplicity: 1
    CIM:
      ClassName: Win32_PhysicalMemory
      Property: PartNumber

  - id: "0508"
    category: Memory
    standard_name: Memory Device Locator
    chinese_name: 插槽位置
    multiplicity: 1
    hide: true
    CIM:
      ClassName: Win32_PhysicalMemory
      Property: DeviceLocator

  - id: "0509"
    category: Memory
    standard_name: Memory Manufacturer
    chinese_name: 制造商
    multiplicity: 1
    hide: true
    CIM:
      ClassName: Win32_PhysicalMemory
      Property: Manufacturer

  - id: "0510"
    category: Memory
    standard_name: Memory Serial Number
    chinese_name: 序列号
    multiplicity: 1
    hide: true
    CIM:
      ClassName: Win32_PhysicalMemory
      Property: SerialNumber

  # ---------- VirtualMemory ----------
  - id: "0601"
    category: VirtualMemory
    standard_name: InitialSize
    chinese_name: 初始大小
    multiplicity: 0
    CIM:
      ClassName: Win32_PageFileSetting
      Property: InitialSize
      post_process:
      - type: human_readable_size
        unit: "MiB"

  - id: "0602"
    category: VirtualMemory
    standard_name: MaximumSize
    chinese_name: 最大值
    multiplicity: 0
    CIM:
      ClassName: Win32_PageFileSetting
      Property: MaximumSize
      post_process:
      - type: human_readable_size
        unit: "MiB"

  - id: "0603"
    category: VirtualMemory
    standard_name: Paging File Location(s)
    chinese_name: 页面文件位置
    multiplicity: 0
    CIM:
      ClassName: Win32_PageFileSetting
      Property: Name
      post_process:
      - type: uppercase_drive
    SystemInfo:
      field: "页面文件位置"

  # ---------- Volume ----------
  - id: "0701"
    category: Volume
    standard_name: DriveLetter
    chinese_name: 盘符
    multiplicity: 1
    adv_vol:
      properties: [DriveLetter, DeviceID]
      post_process:
        - type: extract
          index: 0
        - type: uppercase_drive

  - id: "0702"
    category: Volume
    standard_name: VolumeName
    chinese_name: 卷标
    multiplicity: 1
    adv_vol:
      properties: [FileSystemLabel, VolumeName]

  - id: "0703"
    category: Volume
    standard_name: Size
    chinese_name: 容量
    multiplicity: 1
    adv_vol:
      properties: [Size]
      post_process: 
      - type: human_readable_size
        unit: "Byte"

  - id: "0704"
    category: Volume
    standard_name: FreeSpace
    chinese_name: 可用
    multiplicity: 1
    adv_vol:
      properties: [SizeRemaining, FreeSpace]
      post_process: 
      - type: human_readable_size
        unit: "Byte"
      
  - id: "0705"
    category: Volume
    standard_name: AllocationUnitSize
    chinese_name: 分配单元
    multiplicity: 1
    adv_vol:
        properties: [AllocationUnitSize]
        post_process: 
          - type: human_readable_size
            unit: "Byte"

  - id: "0706"
    category: Volume
    standard_name: FileSystem
    chinese_name: 文件系统
    multiplicity: 1
    adv_vol:
      properties: [FileSystem]

  - id: "0707"
    category: Volume
    standard_name: PartitionStyle
    chinese_name: 分区表
    multiplicity: 1
    adv_vol:
      properties: [PartitionStyle]
      post_process: *partition_style_map

  - id: "0708"
    category: Volume
    standard_name: PartitionType
    chinese_name: 分区类型
    multiplicity: 1
    adv_vol:
      properties: [GptType]
      post_process: *gpt_type_map

  - id: "0709"
    category: Volume
    standard_name: DriveType
    chinese_name: 驱动器类型
    multiplicity: 1
    adv_vol:
      properties: [DriveType]
      post_process: *drive_type_map
      

  - id: "0718"
    category: Volume
    standard_name: VolumeSerialNumber
    chinese_name: 序列号
    multiplicity: 1
    hide: true
    adv_vol:
      properties: [SerialNumber, VolumeSerialNumber]

  - id: "0710"
    category: Volume
    standard_name: Compressed
    chinese_name: 启用压缩
    multiplicity: 1
