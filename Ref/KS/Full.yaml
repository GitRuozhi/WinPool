  # ---------- Network ----------
  - id: "1201"
    category: Network
    standard_name: Adapter Name
    chinese_name: 名称
    multiplicity: 1
    Powershell:
    - command: |
        Get-CimInstance -Namespace root/StandardCimv2 -ClassName MSFT_NetAdapter |
        Where-Object { $_.ConnectorPresent -or $_.InterfaceType -ne 0 } |
        Sort-Object InterfaceIndex | Select-Object -ExpandProperty Name

  - id: "1202"
    category: Network
    standard_name: Hardware
    chinese_name: 硬件
    multiplicity: 1
    Powershell:
    - command: |
        Get-CimInstance -Namespace root/StandardCimv2 -ClassName MSFT_NetAdapter |
        Where-Object { $_.ConnectorPresent -or $_.InterfaceType -ne 0 } |
        Sort-Object InterfaceIndex | Select-Object -ExpandProperty DriverDescription

  - id: "1203"
    category: Network
    standard_name: Link Speed
    chinese_name: 链路速度
    multiplicity: 1
    Powershell:
    - command: |
        Get-CimInstance -Namespace root/StandardCimv2 -ClassName MSFT_NetAdapter |
        Where-Object { $_.ConnectorPresent -or $_.InterfaceType -ne 0 } |
        Sort-Object InterfaceIndex |
        ForEach-Object {
            if ($null -ne $_.Speed) {
                $_.Speed.ToString()
            } else {
                ""
            }
        }
      post_process:    
      - type: calculate
        operation: divide
        by: 1000000
      - type: add_unit
        unit: "Mbps"

  - id: "1204"
    category: Network
    standard_name: IPv4 Address
    chinese_name: IPv4地址
    multiplicity: 1
    Powershell:
    - command: |
        $adapters = Get-CimInstance -Namespace root/StandardCimv2 -ClassName MSFT_NetAdapter |
                    Where-Object { $_.ConnectorPresent -or $_.InterfaceType -ne 0 } |
                    Sort-Object InterfaceIndex
        $result = @()
        foreach ($a in $adapters) {
            $ip = Get-CimInstance -Namespace root/StandardCimv2 -ClassName MSFT_NetIPAddress -Filter "InterfaceIndex=$($a.InterfaceIndex) AND AddressFamily=2" |
                  Select-Object -First 1
            $result += if ($ip) { $ip.IPAddress } else { $null }
        }
        $result

  - id: "1205"
    category: Network
    standard_name: IPv6 Address
    chinese_name: IPv6地址
    multiplicity: 1
    Powershell:
    - command: |
        $adapters = Get-CimInstance -Namespace root/StandardCimv2 -ClassName MSFT_NetAdapter |
                    Where-Object { $_.ConnectorPresent -or $_.InterfaceType -ne 0 } |
                    Sort-Object InterfaceIndex
        $result = @()
        foreach ($a in $adapters) {
            $ip = Get-CimInstance -Namespace root/StandardCimv2 -ClassName MSFT_NetIPAddress -Filter "InterfaceIndex=$($a.InterfaceIndex) AND AddressFamily=23" |
                  Select-Object -First 1
            $result += if ($ip) { $ip.IPAddress } else { $null }
        }
        $result

  - id: "1206"
    category: Network
    standard_name: MAC Address
    chinese_name: MAC地址
    multiplicity: 1
    Powershell:
    - command: |
        Get-CimInstance -Namespace root/StandardCimv2 -ClassName MSFT_NetAdapter |
        Where-Object { $_.ConnectorPresent -or $_.InterfaceType -ne 0 } |
        Sort-Object InterfaceIndex | Select-Object -ExpandProperty PermanentAddress

  - id: "1207"
    category: Network
    standard_name: Default Route
    chinese_name: 主网络
    multiplicity: 1
    Powershell:
      - command: | 
          $adapters = Get-CimInstance -Namespace root/StandardCimv2 -ClassName MSFT_NetAdapter |
                      Where-Object { $_.ConnectorPresent -or $_.InterfaceType -ne 0 } |
                      Sort-Object InterfaceIndex
          $defaultRoute = Get-CimInstance -Namespace root/StandardCimv2 -ClassName MSFT_NetRoute -Filter "DestinationPrefix='0.0.0.0/0'" | Select-Object -First 1
          $defaultIfIndex = if ($defaultRoute) { $defaultRoute.InterfaceIndex } else { $null }
          $result = @()
          foreach ($a in $adapters) {
              $result += $a.InterfaceIndex -eq $defaultIfIndex
          }
          $result
        post_process: *boolean_map 

