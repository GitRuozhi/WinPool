      "0": "Healthy"
      "1": "Warning"
      "2": "Unhealthy"
      "3": "Unknown"

operational_status_map: &operational_status_map
  - type: map
    mapping:
      "0": "Unknown"
      "1": "Other"
      "2": "OK"
      "3": "Degraded"
      "4": "Stressed"
