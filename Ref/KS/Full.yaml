    mapping:
      "0": "Unknown"
      "1": "No Root Directory"
      "2": "Removable Disk"
      "3": "Local Disk"
      "4": "Network Drive"
      "5": "Compact Disc"
      "6": "RAM Disk"

boolean_map: &boolean_map
